name: Publish image to GHCR

# Builds the Scriptorium image for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/<owner>/scriptorium-library. It only runs when started by hand from the
# Actions tab ("Run workflow"), so nothing is published by accident.
# To publish automatically on every GitHub release, add:
#   release:
#     types: [published]
# under "on:" below.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0 (also used as the image tag)"
        required: true
      latest:
        description: "Also tag this build as :latest"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registries need lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/scriptorium-library" >> "$GITHUB_ENV"

      - name: Check the version format
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
            || { echo "Version must look like v1.2.3"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        run: |
          TAGS="${IMAGE}:${{ inputs.version }}"
          if [ "${{ inputs.latest }}" = "true" ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
