{% extends "layout.html" %}
{% block body %}
<div class="page-header">
  <div>
    <h1 class="page-title break">{{ log_filename }}</h1>
  </div>
  <div class="page-actions">
    <a class="btn btn-sm" href="{{ url_for('cwa_logs.download_log', log_filename=log_filename) }}">{{ ui.icon('download') }}{{ _('Download Log') }}</a>
  </div>
</div>
<pre class="log-view">{{ log }}</pre>
{% endblock %}
