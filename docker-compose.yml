# Scriptorium — https://github.com/Mrcoloo/scriptorium-library
# Start with:  docker compose up -d   then open http://<your-server>:8083 (admin / admin123)
services:
  scriptorium:
    image: ghcr.io/mrcoloo/scriptorium-library:latest
    container_name: scriptorium
    environment:
      - PUID=1000            # owner of the files on your volumes: run `id -u`
      - PGID=1000            # run `id -g`
      - TZ=Europe/London     # your time zone, e.g. Europe/Rome, America/New_York
      # Optional — see README "Environment variables":
      # - HARDCOVER_TOKEN=your_hardcover_api_key   # Hardcover as a metadata provider
      # - NETWORK_SHARE_MODE=true                  # library or config on NFS/SMB
      # - TRUSTED_PROXY_COUNT=2                    # more than one reverse proxy in front
      # - CWA_PORT_OVERRIDE=8083                   # port inside the container
    volumes:
      # Settings, users, logs and backups. Back this folder up.
      - ./config:/config
      # Drop zone: books placed here are imported, then REMOVED from this folder.
      - ./ingest:/cwa-book-ingest
      # Your Calibre library. Empty folder = a new library is created for you.
      - ./library:/calibre-library
      # Optional: Calibre plugins for conversion (also copy customize.py.json, see docs/installation.md)
      # - ./calibre-plugins:/config/.config/calibre/plugins
    ports:
      - 8083:8083            # change the left number to use another port on your host
    restart: unless-stopped
    # The image ships a healthcheck; `docker ps` shows the container as healthy once it is up.
